<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How Does CS Fit Into Your Field?</title>
    <link rel="stylesheet" href="style.css">
    <h1>How Does CS Fit Into Your Field?</h1>
    <p class="subtitle">
        Take this quick quiz to discover your tech pathway.
    </p>

    <form id="quizForm">

        <div class="question">
            <h3>You have a free elective. Which sounds most appealing? </h3>
            <label><input type="radio" name="q1" value="innovator" required> A course on entrepreneurship, innovation, or emerging trends.</label>
            <label><input type="radio" name="q1" value="data" value ="future"> A course that helps explain why things work the way they do.</label>
            <label><input type="radio" name="q1" value="creator"> A course with lots of opportunities for creativity and self-expression.</label>
            <label><input type="radio" name="q1" value="community"> A course where you collaborate and discuss ideas with others.</label>
            <label><input type="radio" name="q1" value="builder" value="=systems"> A course with hands-on projects and practical applications.</label>
        </div>

        <div class="question">
            <h3>2. Which activity sounds most interesting?</h3>
            <label><input type="radio" name="q2" value="data" required> Analyzing trends</label>
            <label><input type="radio" name="q2" value="design"> Designing an app</label>
            <label><input type="radio" name="q2" value="health"> Improving hospital technology</label>
            <label><input type="radio" name="q2" value="ai"> Training an AI model</label>
        </div>

        <div class="question">
            <h3>3. What would you rather create?</h3>
            <label><input type="radio" name="q3" value="data" required> A dashboard</label>
            <label><input type="radio" name="q3" value="design"> A website</label>
            <label><input type="radio" name="q3" value="health"> A health-tracking tool</label>
            <label><input type="radio" name="q3" value="ai"> A chatbot</label>
        </div>

        <div class="question">
            <h3>4. Which skill would you most like to learn?</h3>
            <label><input type="radio" name="q4" value="data" required> Data visualization</label>
            <label><input type="radio" name="q4" value="design"> User experience design</label>
            <label><input type="radio" name="q4" value="health"> Digital health systems</label>
            <label><input type="radio" name="q4" value="ai"> Machine learning</label>
        </div>

        <button type="submit">See My Results</button>

    </form>

    <div id="result" class="hidden">
        <h2 id="resultTitle"></h2>
        <p id="resultText"></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
