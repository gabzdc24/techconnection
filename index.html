<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How Does CS Fit Into Your Field?</title>
    <link rel="stylesheet" href="style.css">
    <h1>How Does CS Fit Into Your Field?</h1>
    <p class="subtitle">
        Take this quick quiz to discover your tech pathway.
    </p>

    <form id="quizForm">

        <div class="question">
            <h3>You have a free elective. Which sounds most appealing? </h3>
            <label><input type="radio" name="q1" value="innovator"> A course on entrepreneurship, innovation, or emerging trends.</label>
            <label><input type="radio" name="q1" value="data" value ="future"> A course that helps explain why things work the way they do.</label>
            <label><input type="radio" name="q1" value="creator"> A course with lots of opportunities for creativity and self-expression.</label>
            <label><input type="radio" name="q1" value="community"> A course where you collaborate and discuss ideas with others.</label>
            <label><input type="radio" name="q1" value="builder" value="=systems"> A course with hands-on projects and practical applications.</label>
        </div>

        <div class="question">
            <h3>Which campus event sounds most appealing?</h3>
            <label><input type="radio" name="q2" value="innovator">A startup challenge or innovation event. </label>
            <label><input type="radio" name="q2" value="data"> A guest speaker discussing new discoveries.</label>
            <label><input type="radio" name="q1" value="creator"> An art, gaming, or creator showcase.</label>
            <label><input type="radio" name="q1" value="community">A networking or club social event.</label>
            <label><input type="radio" name="q1" value="builder" value="=systems"> A hands-on workshop where you make something.</label>
        </div>

        <div class="question">
            <h3>How do you start assignments?</h3>
            <label><input type="radio" name="q2" value="innovator">I get excited and begin planning ideas. </label>
            <label><input type="radio" name="q2" value="data"></label>
            <label><input type="radio" name="q1" value="creator"> </label>
            <label><input type="radio" name="q1" value="community"></label>
            <label><input type="radio" name="q1" value="builder" value="=systems"></label>
        </div>

        <div class="question">
            <h3>Which compliment would mean the most to you?</h3>
            <label><input type="radio" name="q5" value="innovator">"You always have interesting ideas."</label>
            <label><input type="radio" name="q5" value="data">"You explain things really well."</label>
            <label><input type="radio" name="q5" value="creator">"You're incredibly creative."</label>
            <label><input type="radio" name="q5" value="community">"You make people feel included."</label>
            <label><input type="radio" name="q5" value="builder">"You always get things done."</label>
        </div>

        <button type="submit">See My Results</button>

    </form>

    <div id="result" class="hidden">
        <h2 id="resultTitle"></h2>
        <p id="resultText"></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
